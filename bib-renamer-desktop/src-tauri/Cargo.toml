[package]
name = "bib-renamer-desktop"
version = "0.1.0"
description = "BookNamer Desktop — Renommage intelligent de fichiers EPUB/PDF"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bib_renamer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PDF parsing — métadonnées bas niveau
lopdf = "0.34"

# EPUB parsing — lecture du content.opf
epub = "2.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client async (sans OpenSSL natif, utilise rustls)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "deflate", "brotli"], default-features = false }

# Regex (compilées une fois via once_cell)
regex = "1.10"
once_cell = "1.19"

# Utilitaires
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
walkdir = "2.4"
urlencoding = "2.1"
